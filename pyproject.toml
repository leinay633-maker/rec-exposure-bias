[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rec-offline-eval"
version = "0.1.0"
description = "Offline evaluation of recommender models under exposure bias, checked against KuaiRand random exposures"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyarrow>=18,<27",
    "scipy>=1.12,<2",
    "scikit-learn>=1.4,<2",
    "lightgbm>=4.5,<5",
    "torch>=2.5,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
# study 2 (KuaiRec): frozen text encoder for the semantic IDs
genrec = ["transformers>=4.51", "accelerate>=1.0"]

[project.scripts]
receval = "receval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.uv.sources]
torch = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
