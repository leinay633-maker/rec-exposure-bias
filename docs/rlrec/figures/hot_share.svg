<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 500" width="1160" height="500" role="img" aria-label="分组校准把列表推向热门，常规日志奖励把列表推离热门，混入随机数据的 R5 基本不动">
<style>
svg{--surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781; --grid:#e1e0d9; --axis:#c3c2b7; --R1:#2a78d6; --R3:#eb6834; --R4:#1baf7a; --R5:#eda100; --R6:#e87ba4;font-family:system-ui,"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif}
